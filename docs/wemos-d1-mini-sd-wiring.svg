<text x="394" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="end">GND</text>
<text x="805" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="start">GND</text>
