<text x="600" y="288" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#334155" font-weight="600" text-anchor="middle">Общий провод</text>
<text x="394" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="end">D4 · GPIO2</text>
<text x="805" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="start">CS</text>
<path d="M420 356 H780" stroke="#9b51c7" stroke-width="5" fill="none"/>
