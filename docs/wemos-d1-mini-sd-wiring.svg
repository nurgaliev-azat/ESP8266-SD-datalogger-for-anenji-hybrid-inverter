<circle cx="780" cy="356" r="7" fill="white" stroke="#9b51c7" stroke-width="3"/>
<rect x="460" y="322" width="280" height="25" rx="5" fill="#f3f6fb" stroke="none"/>
<text x="600" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#9b51c7" font-weight="600" text-anchor="middle">Выбор карты</text>
<text x="394" y="416" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="end">D5 · GPIO14</text>
<text x="805" y="416" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="start">CLK / SCK</text>
<path d="M420 409 H780" stroke="#d18a00" stroke-width="5" fill="none"/>
<circle cx="420" cy="409" r="7" fill="white" stroke="#d18a00" stroke-width="3"/>
<circle cx="780" cy="409" r="7" fill="white" stroke="#d18a00" stroke-width="3"/>
<rect x="460" y="375" width="280" height="25" rx="5" fill="#f3f6fb" stroke="none"/>
<text x="600" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#d18a00" font-weight="600" text-anchor="middle">Тактовый сигнал</text>
<text x="394" y="469" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="end">D6 · GPIO12</text>
<text x="805" y="469" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="start">MISO / DO</text>
<path d="M420 462 H780" stroke="#188447" stroke-width="5" fill="none"/>
<circle cx="420" cy="462" r="7" fill="white" stroke="#188447" stroke-width="3"/>
<circle cx="780" cy="462" r="7" fill="white" stroke="#188447" stroke-width="3"/>
<rect x="460" y="428" width="280" height="25" rx="5" fill="#f3f6fb" stroke="none"/>
<text x="600" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#188447" font-weight="600" text-anchor="middle">Карта → ESP8266</text>
<text x="394" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="end">D7 · GPIO13</text>
<text x="805" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="white" font-weight="700" text-anchor="start">MOSI / DI</text>
<path d="M420 515 H780" stroke="#247bcc" stroke-width="5" fill="none"/>
<circle cx="420" cy="515" r="7" fill="white" stroke="#247bcc" stroke-width="3"/>
<circle cx="780" cy="515" r="7" fill="white" stroke="#247bcc" stroke-width="3"/>
<rect x="460" y="481" width="280" height="25" rx="5" fill="#f3f6fb" stroke="none"/>
<text x="600" y="500" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#247bcc" font-weight="600" text-anchor="middle">ESP8266 → карта</text>
<text x="80" y="556" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#d8f3fa" font-weight="400" text-anchor="start">USB → питание D1 mini</text>
<text x="805" y="556" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#d6f7eb" font-weight="400" text-anchor="start">Карта: FAT16 / FAT32</text>
<rect x="55" y="604" width="1090" height="157" rx="16" fill="white" stroke="none"/>
<text x="80" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#17253e" font-weight="700" text-anchor="start">Как соединить</text>
<text x="80" y="666" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#17253e" font-weight="400" text-anchor="start">Shield можно установить на разъёмы D1 mini: совместите обозначения 3V3, G и D5–D7.</text>
<text x="80" y="694" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#17253e" font-weight="400" text-anchor="start">У старого shield v1.0 CS = D8: измените SD_CS_PIN на D8 или выберите CS = D4 на shield.</text>
<text x="80" y="722" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#17253e" font-weight="400" text-anchor="start">GPIO2 (D4) должен быть HIGH при старте. На сигнальные выводы нельзя подавать 5 В.</text>
<text x="55" y="795" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#51637c" font-weight="400" text-anchor="start">Показаны электрические связи; расположение выводов условное. Сверяйте маркировку своей платы.</text>
</svg>